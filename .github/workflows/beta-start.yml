name: Public beta install
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  start-here:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compare the public commands with the verified release manifest
        run: node packages/pi-daddy/scripts/beta-start.mjs
      - name: Check for newer published ecosystem packages
        if: github.event_name == 'schedule'
        run: node packages/pi-daddy/scripts/beta-start.mjs --check-latest
      - run: npm ci
      - name: Verify the documented reproduction commands against published packages
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/published-beta-agent
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          cd "$RUNNER_TEMP"
          sed -n '/^<!-- verified-beta-install:start -->$/,/^<!-- verified-beta-install:end -->$/p' "$GITHUB_WORKSPACE/README.md" | sed -n '/^pi install /p' > beta-install.sh
          bash -e beta-install.sh
          PI_OFFLINE=1 node "$GITHUB_WORKSPACE/packages/pi-daddy/scripts/beta-grants.mjs" "$(command -v pi)"

  current-pi-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install current Pi and record the exact version
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/current-pi"
          version=$(npm view @earendil-works/pi-coding-agent dist-tags.latest)
          npm install --prefix "$runtime" --no-audit --no-fund "@earendil-works/pi-coding-agent@$version"
          test "$("$runtime/node_modules/.bin/pi" --version)" = "$version"
          echo "Tested Pi $version" >> "$GITHUB_STEP_SUMMARY"
          echo "$runtime/node_modules/.bin" >> "$GITHUB_PATH"
          echo "DADDY_TEST_PI_CLI=$runtime/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js" >> "$GITHUB_ENV"
      - name: Exercise clean setup, pin migration, real update and the installed bundle
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/current bundle profile
        run: |
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/packages/pi-daddy/scripts/current-pi-bundle.mjs"
      - run: npm run build
      - name: Run the packed candidate setup and verify its actual Principal roles
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/beta-agent
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/daddy-candidate"
          candidate="$RUNNER_TEMP/daddy-candidate"
          npm pack --workspace pi-daddy --pack-destination "$candidate" --ignore-scripts
          tar -xzf "$candidate"/*.tgz -C "$candidate"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$candidate/node_modules"
          version=$(node -p "require('./packages/pi-daddy/package.json').version")
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/packages/pi-daddy/scripts/beta-candidate-setup.mjs" "$candidate"/*.tgz "$candidate/package"
          pi list
          PI_OFFLINE=1 node "$GITHUB_WORKSPACE/packages/pi-daddy/scripts/beta-grants.mjs" "$(command -v pi)" "$version"
      - name: Exercise candidate child delivery, usage and process cleanup on the same Pi
        working-directory: packages/pi-daddy
        env:
          PI_DADDY_LEAN_TOOLS: "0"
          DADDY_TEST_PATTERN_RECEIPT: ${{ runner.temp }}/current-pi-native-cleanup.json
        run: node --test test-integration/pi-sdk/owned-pattern-cleanup.it.ts test-integration/pi-sdk/child-tool-delivery.it.ts test-integration/pi-sdk/child-usage-total.it.ts
      - name: Verify fixtures leave tracked files unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-pi-native-cleanup
          path: ${{ runner.temp }}/current-pi-native-cleanup.json
          if-no-files-found: warn
