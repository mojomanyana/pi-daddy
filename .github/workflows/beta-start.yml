name: Public beta install
on:
  pull_request:
    paths:
      - ".github/beta-release.json"
      - ".github/workflows/beta-start.yml"
      - "packages/pi-daddy/scripts/beta-start.mjs"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-here:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compare the public commands with the verified release manifest
        run: node packages/pi-daddy/scripts/beta-start.mjs
      - name: Install the published packages using a fresh Pi profile
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/beta-agent
        run: |
          set -euo pipefail
          pi_version=$(node -p "require('./.github/beta-release.json').piSdk")
          npm install --prefix "$RUNNER_TEMP/beta-runtime" --no-audit --no-fund "@earendil-works/pi-coding-agent@$pi_version"
          export PATH="$RUNNER_TEMP/beta-runtime/node_modules/.bin:$PATH"
          # The preceding check restricts this block to exact, pinned pi install commands.
          sed -n '/^<!-- verified-beta-install:start -->$/,/^<!-- verified-beta-install:end -->$/p' README.md | sed -n '/^pi install /p' > "$RUNNER_TEMP/beta-install.sh"
          bash -e "$RUNNER_TEMP/beta-install.sh"
          pi list
