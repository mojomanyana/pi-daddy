name: Public beta install
on:
  pull_request:
    paths:
      - "packages/pi-daddy/src/products/ecosystem-release.json"
      - "packages/pi-daddy/src/products/setup-doctor.ts"
      - "packages/pi-daddy/src/cli.ts"
      - "packages/pi-daddy/scripts/beta-grants.mjs"
      - "packages/pi-daddy/package.json"
      - "package-lock.json"
      - ".github/workflows/beta-start.yml"
      - "packages/pi-daddy/scripts/beta-start.mjs"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-here:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Compare the public commands with the verified release manifest
        run: node packages/pi-daddy/scripts/beta-start.mjs
      - run: npm ci
      - run: npm run build
      - name: Run setup in a fresh Pi profile and verify the published Principal roles
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/beta-agent
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          test "$(pi --version)" = "$(node -p "require('./packages/pi-daddy/src/products/ecosystem-release.json').piSdk")"
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/packages/pi-daddy/dist/cli.js" setup
          pi list
          PI_OFFLINE=1 node "$GITHUB_WORKSPACE/packages/pi-daddy/scripts/beta-grants.mjs" "$(command -v pi)"
